name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: 自测（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 语法检查
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('relocator.ps1', 'tests/selftest.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $errors | ForEach-Object { Write-Host "::error file=$file,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              $failed = $true
            } else { Write-Host "$file 语法 OK" }
          }
          if ($failed) { exit 1 }

      - name: 启动器必须是 CRLF
        shell: pwsh
        run: |
          # LF-only 的 .cmd 会被 cmd 静默解析错，退出码却是 0 —— 必须挡住
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'relocator.cmd'))
          $lf = 0; $crlf = 0
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            if ($bytes[$i] -eq 10) { if ($i -gt 0 -and $bytes[$i-1] -eq 13) { $crlf++ } else { $lf++ } }
          }
          Write-Host "CRLF=$crlf 单独LF=$lf"
          if ($lf -gt 0) { Write-Host '::error::relocator.cmd 里有单独的 LF 换行，cmd 会解析错'; exit 1 }

      - name: 启动器冒烟测试
        shell: pwsh
        run: |
          $out = & cmd /c ".\relocator.cmd" list 2>&1
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::relocator.cmd 传参执行失败'; exit 1 }
          if (($out -join '') -notmatch '台账') { Write-Host '::error::没有看到预期的台账输出'; exit 1 }

      - name: 主脚本冒烟测试
        shell: pwsh
        run: |
          $state = Join-Path $env:TEMP ('wcr-ci-' + [guid]::NewGuid().ToString('N').Substring(0,8))
          New-Item -ItemType Directory -Path $state -Force | Out-Null
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\relocator.ps1 list -StateDir $state 2>&1
          Write-Host $out
          if ($out -notmatch '台账') { Write-Host '::error::list 没有输出台账信息'; exit 1 }
          Remove-Item $state -Recurse -Force -ErrorAction SilentlyContinue

      - name: 真实搬移与撤销
        shell: pwsh
        run: ./tests/selftest.ps1

      - name: 检查文档里的相对链接
        shell: pwsh
        run: |
          $missing = 0
          $content = Get-Content README.md -Raw
          foreach ($m in [regex]::Matches($content, '\]\((?<url>[^)#]+)\)')) {
            $url = $m.Groups['url'].Value
            if ($url -match '^https?://') { continue }
            if (-not (Test-Path -LiteralPath $url)) {
              Write-Host "::error::README 里的链接指向不存在的文件：$url"
              $missing++
            }
          }
          if ($missing) { exit 1 }
          Write-Host '链接全部有效'
